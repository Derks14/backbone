spring.application.name=backbone

spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}
server.port=8000


app.spotify-client-id=${SPOTIFY_CLIENT_ID}
app.spotify-client-secret=${SPOTIFY_CLIENT_SECRET}
app.spotify-redirect-uri=${SPOTIFY_REDIRECT_URI}
app.cors-allowed-origins=${CORS_ALLOWED_ORIGINS}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true

logging.structured.format.console=ecs
logging.structured.ecs.service.name=${spring.application.name}

spring.cache.type=redis
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
