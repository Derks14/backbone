spring.application.name=backbone

#spring.data.mongodb.uri=mongodb://root:prod-secret@mongodb:27017/keteku

app.spotify-client-id=${SPOTIFY_CLIENT_ID}
app.spotify-client-secret=${SPOTIFY_CLIENT_SECRET}
app.spotify-redirect-uri=${SPOTIFY_REDIRECT_URI}

server.port=8000

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.docker.compose.enabled=false
