services:
  spring-app:
    image: eclipse-temurin:17-jdk
    container_name: spring-backbone
    working_dir: /app
    volumes:
      - /srv/backbone/target:/app
      - /srv/backbone/otel:/app/otel:ro
    command: ["java", "-javaagent:/app/otel/opentelemetry-javaagent.jar", "-jar", "/app/backbone.jar"]
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATA_MONGODB_URI=${MONGODB_URI}
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - OTEL_SERVICE_NAME=backbone
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=otlp
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_ENABLED=true
      - OTEL_INSTRUMENTATION_LOGBACK_APPENDER_EXPERIMENTAL_LOG_ATTRIBUTES=true
      - OTEL_INSTRUMENTATION_RUNTIME_METRICS_ENABLED=true
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=prod,service.namespace=keteku
    ports:
      - '8000:8000'
    networks:
      - dbnet
      - observability
    profiles:
      - prod

networks:
  dbnet:
    external: true
  observability:
    external: true



